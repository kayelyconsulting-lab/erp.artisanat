<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ERP Artisanat – Kayely Group</title>
<style>
:root {
  --primary:#1A3A6E;
  --secondary:#F47C1A;
  --primary-light:#2456A4;
  --secondary-light:#FFA040;
  --accent:#EEF3FB;
  --success:#27AE60;
  --danger:#E74C3C;
  --warning:#F39C12;
  --info:#2980B9;
  --bg:#F5F7FB;
  --card:#FFFFFF;
  --border:#E2E8F0;
  --text:#1E2A3A;
  --text-light:#6B7A8D;
  --sidebar-w:240px;
  --radius:10px;
  --shadow:0 2px 12px rgba(26,58,110,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* ======= LOGIN ======= */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 50%,#1E5799 100%);padding:16px;}
.login-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.18);
  border-radius:20px;padding:32px 28px;width:100%;max-width:420px;color:#fff;}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{height:80px;width:80px;object-fit:contain;background:rgba(255,255,255,0.15);
  border-radius:14px;padding:8px;margin-bottom:10px}
.login-logo h1{font-size:1.4rem;font-weight:700;letter-spacing:.5px}
.login-logo p{font-size:.82rem;opacity:.75;margin-top:4px}
.sync-banner{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);
  border-radius:20px;padding:6px 14px;margin:0 auto 20px;width:fit-content;font-size:.8rem;color:rgba(255,255,255,.9);}
.sdot{width:9px;height:9px;border-radius:50%;background:#ccc;flex-shrink:0;transition:background .3s}
.sdot.online{background:var(--success);box-shadow:0 0 6px var(--success);animation:pulse 2s infinite}
.sdot.connecting{background:var(--warning);animation:pulse 1s infinite}
.sdot.offline{background:var(--danger)}
.users-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.user-card-btn{background:rgba(255,255,255,0.10);border:2px solid rgba(255,255,255,0.20);
  border-radius:14px;padding:16px 12px;cursor:pointer;color:#fff;text-align:center;
  transition:all .2s;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.user-card-btn:hover{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,.5);transform:translateY(-2px)}
.u-icon{font-size:1.8rem;line-height:1}
.u-name{font-weight:700;font-size:.95rem}
.u-role{font-size:.72rem;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.u-online{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--success);
  border-radius:50%;box-shadow:0 0 4px var(--success)}
.pin-block{display:none;text-align:center;margin-top:8px}
.pin-block.show{display:block}
.sel-user-info{display:flex;align-items:center;gap:12px;margin-bottom:16px;
  background:rgba(255,255,255,0.10);border-radius:10px;padding:10px 14px}
#selUserIcon{font-size:1.6rem}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent;transition:all .2s}
.pin-dot.filled{background:#fff;border-color:#fff}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto}
.pin-btn{background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.25);
  border-radius:10px;color:#fff;font-size:1.2rem;font-weight:600;padding:14px;cursor:pointer;transition:all .15s}
.pin-btn:hover{background:rgba(255,255,255,0.30)}
.pin-btn:active{transform:scale(.95)}
.btn-back{background:none;border:1.5px solid rgba(255,255,255,.4);border-radius:8px;
  color:rgba(255,255,255,.8);padding:8px 16px;cursor:pointer;font-size:.85rem;margin-top:12px;width:100%}
.btn-back:hover{background:rgba(255,255,255,.1)}
.pin-hint-box{margin-top:14px;background:rgba(255,255,255,.07);border-radius:10px;
  padding:12px 16px;border:1px solid rgba(255,255,255,.13)}
.pin-hint-title{font-size:.72rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.pin-hint-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;
  font-size:.82rem;color:rgba(255,255,255,.82)}
.pin-hint-row code{background:rgba(255,255,255,.13);padding:2px 8px;border-radius:4px;
  font-family:monospace;font-size:.88rem;color:#fff;letter-spacing:2px}

/* ======= APP SHELL ======= */
#appContainer{display:none;min-height:100vh}
#appContainer.visible{display:flex}

/* ======= SIDEBAR ======= */
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--primary) 0%,var(--primary-light) 100%);
  color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;
  z-index:100;transition:transform .3s;overflow-y:auto}
.sidebar-header{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar-header-inner{display:flex;align-items:center;gap:10px}
.sidebar-header-inner img{height:40px;width:40px;object-fit:contain;background:rgba(255,255,255,.15);
  border-radius:7px;padding:3px;flex-shrink:0}
.sidebar-title{font-size:.95rem;font-weight:700;line-height:1.2}
.sidebar-version{font-size:.68rem;opacity:.6;margin-top:1px}
.sidebar-entity{font-size:.72rem;opacity:.75;margin-top:2px;padding:0 16px 8px;
  border-bottom:1px solid rgba(255,255,255,.10)}
nav ul{list-style:none;padding:8px 0}
.nav-item{margin:1px 8px}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 12px;color:rgba(255,255,255,.8);
  background:none;border:none;width:100%;border-radius:8px;cursor:pointer;font-size:.88rem;transition:all .15s}
.nav-link:hover,.nav-link.active{background:rgba(255,255,255,.18);color:#fff}
.nav-link .icon{font-size:1rem;width:20px;text-align:center}
.nav-section-title{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;
  color:rgba(255,255,255,.4);padding:10px 20px 4px}
.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.12)}
.user-badge{display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:rgba(255,255,255,.12);border-radius:8px;margin-bottom:8px}
.user-badge .ub-icon{font-size:1.3rem}
.user-badge .ub-name{font-size:.82rem;font-weight:600}
.user-badge .ub-role{font-size:.68rem;opacity:.65}
.btn-logout{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;
  color:rgba(255,255,255,.85);padding:7px;cursor:pointer;font-size:.82rem;transition:all .2s}
.btn-logout:hover{background:rgba(231,76,60,.3);border-color:rgba(231,76,60,.5)}

/* ======= MAIN ======= */
.main-content{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;
  box-shadow:0 1px 6px rgba(26,58,110,.07)}
.topbar-title h2{font-size:1.1rem;font-weight:700;color:var(--primary)}
.topbar-title p{font-size:.78rem;color:var(--text-light);margin-top:1px}
.topbar-actions{display:flex;align-items:center;gap:10px}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text-light);
  background:var(--accent);border-radius:20px;padding:5px 12px;border:1px solid var(--border)}
.sync-pill .sdot{width:7px;height:7px}
.content{padding:24px;flex:1}

/* ======= CARDS ======= */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  border:1px solid var(--border);margin-bottom:20px}
.card-header{padding:14px 18px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:.95rem;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px}
.card-body{padding:16px 18px}

/* ======= KPI GRID ======= */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  border:1px solid var(--border);padding:16px 18px;display:flex;align-items:flex-start;gap:14px}
.kpi-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:1.3rem;flex-shrink:0}
.kpi-icon.blue{background:#EEF3FB;color:var(--primary)}
.kpi-icon.green{background:#EAFAF1;color:var(--success)}
.kpi-icon.orange{background:#FEF5E7;color:var(--secondary)}
.kpi-icon.red{background:#FDEDEC;color:var(--danger)}
.kpi-label{font-size:.75rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.4px}
.kpi-value{font-size:1.3rem;font-weight:700;color:var(--text);margin-top:3px;line-height:1.1}
.kpi-sub{font-size:.72rem;color:var(--text-light);margin-top:2px}

/* ======= TABLE ======= */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
thead th{background:var(--accent);color:var(--primary);font-weight:600;padding:10px 12px;
  text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
tbody tr:hover{background:var(--accent)}
tbody td{padding:9px 12px;vertical-align:middle}

/* ======= BADGES ======= */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;
  font-size:.72rem;font-weight:600;letter-spacing:.3px}
.badge-success{background:#EAFAF1;color:var(--success)}
.badge-danger{background:#FDEDEC;color:var(--danger)}
.badge-warning{background:#FEF5E7;color:var(--warning)}
.badge-info{background:#EBF5FB;color:var(--info)}
.badge-gray{background:#F0F0F0;color:#666}

/* ======= BUTTONS ======= */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;
  border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-secondary{background:var(--secondary);color:#fff}
.btn-secondary:hover{background:var(--secondary-light)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--primary);background:var(--accent)}
.btn-sm{padding:5px 11px;font-size:.78rem}
.btn-icon{background:none;border:none;cursor:pointer;padding:5px 7px;border-radius:6px;
  font-size:1rem;transition:background .15s;color:var(--text-light)}
.btn-icon:hover{background:var(--accent)}
.btn-icon.edit:hover{color:var(--info)}
.btn-icon.del:hover{color:var(--danger)}

/* ======= FORMS ======= */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:.8rem;font-weight:600;color:var(--text)}
.form-control{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;
  font-size:.88rem;background:var(--card);color:var(--text);width:100%;
  transition:border-color .15s;outline:none}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,58,110,.08)}
.req{color:var(--danger)}

/* ======= MODAL ======= */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;
  display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:14px;box-shadow:0 12px 48px rgba(0,0,0,.22);
  width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:1rem;font-weight:700;color:var(--primary)}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-light);
  padding:2px 6px;border-radius:4px}
.modal-close:hover{background:var(--accent)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end}

/* ======= MOBILE NAV ======= */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;
  background:var(--card);border-top:1px solid var(--border);z-index:200;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.mobile-nav ul{display:flex;justify-content:space-around;list-style:none}
.mobile-nav-btn{background:none;border:none;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;padding:5px 8px;
  color:var(--text-light);font-size:.62rem;transition:color .15s}
.mobile-nav-btn.active,.mobile-nav-btn:hover{color:var(--primary)}
.mobile-nav-btn .icon{font-size:1.2rem}
.mobile-fab{display:none;position:fixed;bottom:72px;right:16px;z-index:199;
  background:var(--secondary);color:#fff;border:none;border-radius:50%;
  width:50px;height:50px;font-size:1.5rem;cursor:pointer;
  box-shadow:0 4px 16px rgba(244,124,26,.4);transition:transform .15s}
.mobile-fab:hover{transform:scale(1.08)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99}

/* ======= PARAMETRES ======= */
.param-logo-zone{display:flex;flex-direction:column;align-items:center;gap:8px}
.param-logo-preview{width:130px;height:130px;border:2px dashed var(--border);border-radius:10px;
  display:flex;align-items:center;justify-content:center;background:var(--accent);overflow:hidden;flex-shrink:0}
.logo-ph{text-align:center;color:var(--text-light);font-size:2rem}
.param-entite-layout{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start}
.param-row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.icon-pick-btn{background:none;border:2px solid var(--border);border-radius:8px;
  font-size:1.4rem;padding:6px 10px;cursor:pointer;transition:all .2s}
.icon-pick-btn.selected{border-color:var(--primary);background:var(--accent)}

/* ======= ENTITY BADGE ======= */
.entity-banner{display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:linear-gradient(90deg,var(--accent),#fff);border-radius:10px;
  border-left:4px solid var(--primary);margin-bottom:20px}
.entity-banner img{height:38px;border-radius:5px}
.entity-banner .eb-name{font-weight:700;color:var(--primary);font-size:1rem}
.entity-banner .eb-sub{font-size:.75rem;color:var(--text-light);margin-top:1px}

/* ======= TOAST ======= */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  padding:10px 24px;border-radius:24px;font-size:.88rem;font-weight:600;
  color:#fff;z-index:9999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2);
  animation:fadeIn .2s ease}
.toast.show{display:block}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--info)}

/* ======= GOOGLE SHEETS CONFIG ======= */
.gs-config-box{background:var(--accent);border:1.5px solid var(--border);border-radius:10px;
  padding:16px 18px;margin-bottom:16px}
.gs-status-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gs-steps{counter-reset:step;list-style:none;padding:0}
.gs-steps li{counter-increment:step;padding:6px 0 6px 32px;position:relative;font-size:.85rem;color:var(--text)}
.gs-steps li::before{content:counter(step);position:absolute;left:0;top:5px;
  width:22px;height:22px;background:var(--primary);color:#fff;border-radius:50%;
  font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.gs-steps a{color:var(--secondary);font-weight:600}

/* ======= MISC ======= */
.top-actions{display:flex;gap:8px;align-items:center}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state .ei{font-size:2.5rem;margin-bottom:8px}
.empty-state p{font-size:.88rem}
.alert{padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:12px;border-left:4px solid}
.alert-warning{background:#FEF5E7;border-color:var(--warning);color:#8B6914}
.alert-info{background:#EBF5FB;border-color:var(--info);color:#1A5276}
.alert-danger{background:#FDEDEC;border-color:var(--danger);color:#922B21}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.text-muted{color:var(--text-light)}
.text-right{text-align:right}
.fw-bold{font-weight:700}
.color-success{color:var(--success)}
.color-danger{color:var(--danger)}
.color-warning{color:var(--warning)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .main-content{margin-left:0}
  .mobile-nav{display:block}
  .mobile-fab{display:flex;align-items:center;justify-content:center}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .form-grid,.form-grid-3,.param-row-2,.param-entite-layout{grid-template-columns:1fr}
  .content{padding:14px;padding-bottom:130px}
  .topbar{padding:10px 14px}
}
@media print{.sidebar,.mobile-nav,.mobile-fab,.topbar,.sidebar-overlay{display:none!important}
  .main-content{margin-left:0}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>

}
function pinClear(){pinBuf='';updatePinDots();document.getElementById('pinError').textContent='';}

function updatePinDots(){
  for(let i=0;i<4;i++){

// ================================================================
//  GOOGLE SHEETS SYNC
// ================================================================
class SheetsSync {
  constructor(){
    this.apiKey   = localStorage.getItem('gs_api_key')||'';
    this.sheetId  = localStorage.getItem('gs_sheet_id')||'';
    this.online   = navigator.onLine;
    this.syncing  = false;
    this.lastSync = localStorage.getItem('gs_last_sync')||null;
    window.addEventListener('online', ()=>{ this.online=true; this.updateUI(); });
    window.addEventListener('offline',()=>{ this.online=false; this.updateUI(); });
  }
  get configured(){ return this.apiKey && this.sheetId; }
  save(key,val){ localStorage.setItem('gs_'+key,val||''); }

  // Lire une feuille → tableau de lignes
  async readSheet(sheetName){
    if(!this.configured) return [];
    try{
      const url=`https://sheets.googleapis.com/v4/spreadsheets/${this.sheetId}/values/${encodeURIComponent(sheetName)}?key=${this.apiKey}`;
      const r=await fetch(url);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d=await r.json();
      const rows=d.values||[];
      if(rows.length<2) return [];
      const headers=rows[0];
      return rows.slice(1).map(row=>{
        const obj={};
        headers.forEach((h,i)=>{ obj[h]=row[i]||''; });
        return obj;
      });
    }catch(e){ console.warn('readSheet',sheetName,e.message); return []; }
  }

  // Écrire une ligne
  async appendRow(sheetName, rowData){
    if(!this.configured||!this.online) return false;
    try{
      const url=`https://sheets.googleapis.com/v4/spreadsheets/${this.sheetId}/values/${encodeURIComponent(sheetName)}:append?valueInputOption=USER_ENTERED&key=${this.apiKey}`;
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({values:[rowData]})});
      return r.ok;
    }catch(e){ return false; }
  }

  // Mettre à jour l'UI sync
  updateUI(){
    const dot=document.getElementById('syncDot');
    const txt=document.getElementById('syncTxt');
    const ldot=document.getElementById('loginDot');
    const ltxt=document.getElementById('loginSyncTxt');
    if(!dot) return;
    if(!this.configured){
      dot.className='sdot offline';txt.textContent='Non config.';
      if(ldot){ ldot.className='sdot offline'; ltxt.textContent='Mode local – Google Sheets non config.'; }
    } else if(!this.online){
      dot.className='sdot offline';txt.textContent='Hors ligne';
      if(ldot){ ldot.className='sdot offline'; ltxt.textContent='Pas de connexion internet'; }
    } else if(this.syncing){
      dot.className='sdot connecting';txt.textContent='Synchro...';
      if(ldot){ ldot.className='sdot connecting'; ltxt.textContent='Synchronisation...'; }
    } else {
      const t=this.lastSync?new Date(this.lastSync).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
      dot.className='sdot online';txt.textContent='Sync'+( t?' '+t:'');
      if(ldot){ ldot.className='sdot online'; ltxt.textContent='Connecté – Google Sheets actif'; }
    }
  }

  async testConnection(){
    if(!this.configured) return false;
    try{
      const url=`https://sheets.googleapis.com/v4/spreadsheets/${this.sheetId}?key=${this.apiKey}`;
      const r=await fetch(url); return r.ok;
    }catch(e){ return false; }
  }
}

// ================================================================
//  INDEXED DB  (stockage local offline-first)
// ================================================================
class LocalDB {
  constructor(){ this.db=null; }
  async init(){
    return new Promise((res,rej)=>{
      const req=indexedDB.open('ERP_Artisanat_v4',1);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        const stores=['encaissements','decaissements','ventes','achats','stocks','journal','sync_queue','parametres'];
        stores.forEach(s=>{
          if(!db.objectStoreNames.contains(s)){
            const os=db.createObjectStore(s,{keyPath:'id',autoIncrement:true});
            if(s!=='parametres'&&s!=='sync_queue') os.createIndex('date','date');
          }
        });
      };
      req.onsuccess=e=>{ this.db=e.target.result; res(); };
      req.onerror=e=>rej(e);
    });
  }
  async getAll(store){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,'readonly');
      const req=tx.objectStore(store).getAll();
      req.onsuccess=()=>res(req.result);
      req.onerror=()=>rej(req.error);
    });
  }
  async add(store,data){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,'readwrite');
      const req=tx.objectStore(store).add({...data,id:undefined});
      req.onsuccess=()=>res(req.result);
      req.onerror=()=>rej(req.error);
    });
  }
  async put(store,data){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,'readwrite');
      const req=tx.objectStore(store).put(data);
      req.onsuccess=()=>res(req.result);
      req.onerror=()=>rej(req.error);
    });
  }
  async delete(store,id){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,'readwrite');
      const req=tx.objectStore(store).delete(id);
      req.onsuccess=()=>res();
      req.onerror=()=>rej(req.error);
    });
  }
  async getParam(key){
    return new Promise(res=>{
      const tx=this.db.transaction('parametres','readonly');
      const req=tx.objectStore('parametres').get(key);
      req.onsuccess=()=>res(req.result?req.result.value:'');
      req.onerror=()=>res('');
    });
  }
  async setParam(key,value){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction('parametres','readwrite');
      const req=tx.objectStore('parametres').put({id:key,value});
      req.onsuccess=()=>res();
      req.onerror=()=>rej(req.error);
    });
  }
  async clear(store){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,'readwrite');
      const req=tx.objectStore(store).clear();
      req.onsuccess=()=>res();
      req.onerror=()=>rej(req.error);
    });
  }
}

    this.sync.updateUI();
    await this.manualSync();
    setInterval(()=>this.manualSync(),60000);
    this.nav('dashboard');
  }

  applyNav(){
    const allowed=NAV_ACCESS[this.user.role]||[];
    document.querySelectorAll('.nav-item').forEach(li=>{
      const btn=li.querySelector('[data-page]');
      if(btn){ li.style.display=allowed.includes(btn.dataset.page)?'':'none'; }
    });
    // Cacher bouton Ajouter pour certaines pages
    this.updateAddBtn();
  }

  nav(page){
    const allowed=NAV_ACCESS[this.user.role]||[];
    if(!allowed.includes(page)){ toast('Accès non autorisé','error'); return; }
    this.page=page;
    // Active nav
    document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
    // Titre
    const titles={
      dashboard:'Tableau de Bord',encaissements:'Encaissements',decaissements:'Décaissements',
      tresorerie:'Trésorerie',ventes:'Ventes',achats:'Achats',stocks:'Stocks',
      comptabilite:'Comptabilité',rapports:'Rapports',journal:'Journal d\'Activité',
      profil:'Profil',parametres:'Paramètres'
    };
    document.getElementById('pageTitle').textContent=titles[page]||page;
    this.updateAddBtn();
    this.render(page);
  }

  updateAddBtn(){
    const btn=document.getElementById('btnAdd');
    const fab=document.querySelector('.mobile-fab');
    const show=['encaissements','decaissements','ventes','achats','stocks'];
    const role=this.user?this.user.role:'';
    const canAdd=show.includes(this.page)&&(role!=='Comptable'||['encaissements','decaissements','achats'].includes(this.page));
    btn.style.display=canAdd?'':'none';
    if(fab) fab.style.display=canAdd?'':'none';
  }

  async render(page){
    const c=document.getElementById('mainContent');
    switch(page){
      case 'dashboard':     await this.renderDashboard(); break;
      case 'encaissements': await this.renderList('encaissements','Encaissement'); break;
      case 'decaissements': await this.renderList('decaissements','Décaissement'); break;
      case 'tresorerie':    await this.renderTresorerie(); break;
      case 'ventes':        await this.renderList('ventes','Vente'); break;
      case 'achats':        await this.renderList('achats','Achat'); break;
      case 'stocks':        await this.renderStocks(); break;
      case 'comptabilite':  await this.renderCompta(); break;
      case 'rapports':      await this.renderRapports(); break;
      case 'journal':       await this.renderJournal(); break;
      case 'profil':        await this.renderProfil(); break;
      case 'parametres':    await this.renderParametres(); break;
      default: c.innerHTML='<div class="empty-state"><div class="ei">🚧</div><p>Page en cours...</p></div>';
    }
  }

  // ------ FORMAT ------
  fmt(n){ return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:0})+' FCFA'; }
  fmtDate(s){ if(!s) return '-'; try{ return new Date(s).toLocaleDateString('fr-FR'); }catch(e){ return s; } }
  today(){ return new Date().toISOString().slice(0,10); }

  // ------ LOG ------
  async log(action,detail){
    await this.db.add('journal',{date:new Date().toISOString(),user:this.user.nom,
      role:this.user.role,action,detail});
  }

  // ------ SYNC ------
  async manualSync(){
    if(!this.sync.configured||!this.sync.online) { this.sync.updateUI(); return; }
    this.sync.syncing=true; this.sync.updateUI();
    try{
      // Pousser la queue offline
      const q=await this.db.getAll('sync_queue');
      for(const item of q){
        const ok=await this.sync.appendRow(item.sheet,item.row);
        if(ok) await this.db.delete('sync_queue',item.id);
      }
      // Pull les données des 4 feuilles principales
      for(const sheet of ['encaissements','decaissements','ventes','achats','stocks']){
        const rows=await this.sync.readSheet(sheet);
        if(rows.length>0){
          await this.db.clear(sheet);
          for(const row of rows){
            const obj={}; Object.keys(row).forEach(k=>obj[k]=row[k]);
            if(obj.montant) obj.montant=parseFloat(obj.montant)||0;
            if(obj.quantite) obj.quantite=parseFloat(obj.quantite)||0;
            if(obj.prix_unitaire) obj.prix_unitaire=parseFloat(obj.prix_unitaire)||0;
            delete obj.id;
            await this.db.add(sheet,obj);
          }
        }
      }
      this.sync.lastSync=new Date().toISOString();
      localStorage.setItem('gs_last_sync',this.sync.lastSync);
    }catch(e){ console.warn('Sync error',e); }
    this.sync.syncing=false; this.sync.updateUI();
  }

  async pushToSheet(sheet,row){
    if(this.sync.configured&&this.sync.online){
      const ok=await this.sync.appendRow(sheet,row);
      if(!ok) await this.db.add('sync_queue',{sheet,row,date:new Date().toISOString()});
    } else if(this.sync.configured){
      await this.db.add('sync_queue',{sheet,row,date:new Date().toISOString()});
    }
  }

  // ------ TRESORERIE ------
  async renderTresorerie(){
    const [enc,dec]=await Promise.all([this.db.getAll('encaissements'),this.db.getAll('decaissements')]);
    const soldeInit=parseFloat(await this.db.getParam('solde_initial'))||0;
    const totalEnc=enc.reduce((s,e)=>s+parseFloat(e.montant||0),0);
    const totalDec=dec.reduce((s,e)=>s+parseFloat(e.montant||0),0);
    const solde=soldeInit+totalEnc-totalDec;
    // Par mois
    const byMonth={};
    [...enc.map(e=>({...e,sens:1})),...dec.map(e=>({...e,sens:-1}))].forEach(op=>{
      const m=(op.date||'').slice(0,7);
      if(!m) return;
      if(!byMonth[m]) byMonth[m]={enc:0,dec:0};
      if(op.sens>0) byMonth[m].enc+=parseFloat(op.montant||0);
      else byMonth[m].dec+=parseFloat(op.montant||0);
    });
    const months=Object.keys(byMonth).sort().slice(-6);
    let html=`<div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-icon blue">&#x1F4B3;</div><div><div class="kpi-label">Solde Actuel</div><div class="kpi-value ${solde<0?'color-danger':'color-success'}">${this.fmt(solde)}</div></div></div>
      <div class="kpi-card"><div class="kpi-icon green">&#x2B06;</div><div><div class="kpi-label">Total Encaissements</div><div class="kpi-value">${this.fmt(totalEnc)}</div></div></div>
      <div class="kpi-card"><div class="kpi-icon red">&#x2B07;</div><div><div class="kpi-label">Total Décaissements</div><div class="kpi-value">${this.fmt(totalDec)}</div></div></div>
    </div>`;
    if(months.length){
      html+=`<div class="card"><div class="card-header"><span class="card-title">&#x1F4CA; Évolution mensuelle (6 derniers mois)</span></div><div class="card-body"><div class="table-wrap"><table>
        <thead><tr><th>Mois</th><th class="text-right">Encaissements</th><th class="text-right">Décaissements</th><th class="text-right">Solde net</th></tr></thead><tbody>`;
      months.forEach(m=>{
        const {enc:e,dec:d}=byMonth[m];
        const net=e-d;
        html+=`<tr><td>${m}</td><td class="text-right color-success">${this.fmt(e)}</td><td class="text-right color-danger">${this.fmt(d)}</td><td class="text-right fw-bold ${net<0?'color-danger':'color-success'}">${this.fmt(net)}</td></tr>`;
      });
      html+=`</tbody></table></div></div></div>`;
    }
    document.getElementById('mainContent').innerHTML=html;
  }

  // ------ GOOGLE SHEETS CONFIG ------
  saveGSConfig(){
    const k=document.getElementById('gsApiKey').value.trim();
    const s=document.getElementById('gsSheetId').value.trim();
    if(!k||!s){ toast('Clé API et Sheet ID obligatoires','error'); return; }
    this.sync.apiKey=k; this.sync.sheetId=s;
    this.sync.save('api_key',k); this.sync.save('sheet_id',s);
    this.sync.updateUI();
    toast('Configuration Google Sheets enregistrée','success');
    this.log('Config','Google Sheets configuré');
    this.renderParametres();
  }
  async testGS(){
    const k=document.getElementById('gsApiKey').value.trim();
    const s=document.getElementById('gsSheetId').value.trim();
    if(!k||!s){ toast('Remplissez les deux champs d\'abord','error'); return; }
    const res=document.getElementById('gsTestResult');
    res.innerHTML='<span style="color:var(--warning)">Test en cours...</span>';
    this.sync.apiKey=k; this.sync.sheetId=s;
    const ok=await this.sync.testConnection();
    res.innerHTML=ok
      ?'<span style="color:var(--success)">&#x2705; Connexion réussie – Google Sheets accessible.</span>'
      :'<span style="color:var(--danger)">&#x274C; Échec – Vérifiez votre clé API, Sheet ID et que la feuille est partagée.</span>';
  }
  clearGSConfig(){
    if(!confirm('Effacer la configuration Google Sheets ?')) return;
    this.sync.apiKey=''; this.sync.sheetId='';
    ['api_key','sheet_id'].forEach(k=>localStorage.removeItem('gs_'+k));
    this.sync.updateUI(); toast('Configuration effacée','info'); this.renderParametres();
  }

  // ------ ENTITE ------
  async uploadLogo(input){
    const file=input.files[0]; if(!file) return;
    if(file.size>700000){ toast('Fichier trop lourd (max 700 Ko)','error'); return; }
    const reader=new FileReader();
    reader.onload=async e=>{ await this.db.setParam('entite_logo',e.target.result); this.renderParametres(); };
    reader.readAsDataURL(file);
  }
  async removeLogo(){ await this.db.setParam('entite_logo',''); this.renderParametres(); }
  async saveEntite(){
    const n=document.getElementById('pNom').value.trim();
    if(!n){ toast('Nom obligatoire','error'); return; }
    await Promise.all([
      this.db.setParam('entite_nom',n),
      this.db.setParam('entite_adresse',document.getElementById('pAdresse').value.trim()),
      this.db.setParam('entite_ville',document.getElementById('pVille').value.trim()),
      this.db.setParam('entite_tel',document.getElementById('pTel').value.trim()),
      this.db.setParam('entite_email',document.getElementById('pEmail').value.trim()),
      this.db.setParam('entite_rccm',document.getElementById('pRccm').value.trim()),
      this.db.setParam('entite_nif',document.getElementById('pNif').value.trim()),
    ]);
    // Mettre à jour sidebar
    const el=document.getElementById('sidebarEntity'); if(el){ el.textContent=n; el.style.display=''; }
    await this.log('Modification','Entité mise à jour: '+n);
    toast('Entité enregistrée','success'); this.renderParametres();
  }
  async saveFinances(){
    await this.db.setParam('solde_initial',document.getElementById('pSolde').value||'0');
    await this.db.setParam('tva',document.getElementById('pTva').value||'18');
    await this.log('Modification','Paramètres financiers mis à jour');

  }

    const roles=['Administrateur','Gerant','Comptable','Vendeur'];
    const icons=['&#x2699;&#xFE0F;','&#x1F451;','&#x1F4CA;','&#x1F6D2;','&#x1F464;','&#x1F9D1;'];

          <select class="form-control" id="euRole">${roles.map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Nouveau PIN (4 chiffres)</label>

          <div style="display:flex;gap:8px;flex-wrap:wrap">${icons.map(ic=>`<button type="button" class="icon-pick-btn ${u.icon===ic?'selected':''}" onclick="this.parentNode.querySelectorAll('.icon-pick-btn').forEach(b=>b.classList.remove('selected'));this.classList.add('selected');document.getElementById('euIcon').value=this.dataset.icon" data-icon="${ic}">${ic}</button>`).join('')}</div>
          <input type="hidden" id="euIcon" value="${u.icon}"></div>
        <div class="form-group"><label class="form-label">Statut</label>
          <select class="form-control" id="euActif"><option value="true" ${u.actif!==false?'selected':''}>Actif</option><option value="false" ${u.actif===false?'selected':''}>Inactif</option></select></div>
      </div>`;
    document.getElementById('modalFooter').innerHTML=`
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="app.saveUser(${u.id},${isNew})">Enregistrer</button>`;
    document.getElementById('modalOverlay').classList.add('open');
  }
  saveUser(id,isNew){
    if(!this.isAdmin()){ toast('Réservé à l\'Administrateur','error'); return; }
    const nom=document.getElementById('euNom').value.trim();
    const role=document.getElementById('euRole').value;
    const pinInput=document.getElementById('euPin').value.trim();
    const icon=document.getElementById('euIcon').value;
    const actif=document.getElementById('euActif').value==='true';
    if(!nom){ toast('Nom obligatoire','error'); return; }
    if(isNew&&(!pinInput||pinInput.length!==4)){ toast('PIN 4 chiffres obligatoire pour un nouvel utilisateur','error'); return; }
    if(pinInput&&pinInput.length!==4){ toast('Le PIN doit faire exactement 4 chiffres','error'); return; }
    let users=JSON.parse(localStorage.getItem('erp_users')||'null')||[...USERS];
    if(isNew){
      users.push({id,nom,role,pin:pinInput,icon,actif});
    } else {
      const idx=users.findIndex(u=>u.id===id);
      if(idx>=0){
        const oldPin=users[idx].pin;
        users[idx]={...users[idx],nom,role,icon,actif,pin:pinInput||oldPin};
      }
    }
    localStorage.setItem('erp_users',JSON.stringify(users));
    closeModal(); toast('Utilisateur enregistré','success'); this.renderParametres();
  }

      </div>`;
    document.getElementById('modalFooter').innerHTML=`
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="app.saveAchat()">Enregistrer</button>`;
    document.getElementById('modalOverlay').classList.add('open');
  }
  async saveAchat(){
    const date=document.getElementById('fDate').value;
    const montant=parseFloat(document.getElementById('fMontant').value)||0;
    const desc=document.getElementById('fDesc').value.trim();
    if(!date||!montant||!desc){ toast('Champs obligatoires manquants','error'); return; }
    const data={date,fournisseur:document.getElementById('fFourn').value,
      libelle:desc,montant,mode:document.getElementById('fMode').value,
      categorie:document.getElementById('fCat').value,
      user:this.user.nom,created:new Date().toISOString()};
    await this.db.add('achats',data);
    await this.pushToSheet('achats',[date,data.fournisseur,desc,montant,data.mode,data.categorie,data.user]);
    await this.log('Achat',desc+' – '+this.fmt(montant));
    closeModal(); toast('Achat enregistré','success'); this.render('achats');
  }

  formStock(item=null){
    document.getElementById('modalTitle').textContent=item?'Modifier Article':'Nouvel Article';
    document.getElementById('modalBody').innerHTML=`
      <div class="form-grid">
        <div class="form-group full"><label class="form-label">Désignation <span class="req">*</span></label>
          <input type="text" class="form-control" id="fDes" value="${item?item.designation||item.article||'':''}" placeholder="Nom de l'article"></div>
        <div class="form-group"><label class="form-label">Catégorie</label>
          <input type="text" class="form-control" id="fCat" value="${item?item.categorie||'':''}" placeholder="Ex: Tissu, Outil..."></div>
        <div class="form-group"><label class="form-label">Quantité <span class="req">*</span></label>
          <input type="number" class="form-control" id="fQte" value="${item?item.quantite||0:0}" min="0"></div>
        <div class="form-group"><label class="form-label">Seuil d'alerte</label>
          <input type="number" class="form-control" id="fSeuil" value="${item?item.seuil||0:0}" min="0"></div>
        <div class="form-group"><label class="form-label">Prix unitaire (FCFA)</label>
          <input type="number" class="form-control" id="fPrix" value="${item?item.prix_unitaire||0:0}" min="0"></div>
        <div class="form-group"><label class="form-label">Fournisseur</label>
          <input type="text" class="form-control" id="fFourn" value="${item?item.fournisseur||'':''}" placeholder="Optionnel"></div>
      </div>`;
    document.getElementById('modalFooter').innerHTML=`
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="app.saveStock(${item?item.id:'null'})">Enregistrer</button>`;
    document.getElementById('modalOverlay').classList.add('open');
  }
  async saveStock(id){
    const des=document.getElementById('fDes').value.trim();
    const qte=parseFloat(document.getElementById('fQte').value)||0;
    if(!des){ toast('Désignation obligatoire','error'); return; }
    const data={designation:des,categorie:document.getElementById('fCat').value,
      quantite:qte,seuil:parseFloat(document.getElementById('fSeuil').value)||0,
      prix_unitaire:parseFloat(document.getElementById('fPrix').value)||0,
      fournisseur:document.getElementById('fFourn').value,
      date:this.today(),user:this.user.nom,created:new Date().toISOString()};
    if(id){ await this.db.put('stocks',{...data,id}); }
    else {
      await this.db.add('stocks',data);
      await this.pushToSheet('stocks',[des,data.categorie,qte,data.seuil,data.prix_unitaire,data.fournisseur,data.user]);
    }
    await this.log(id?'Modification':'Ajout','Stock: '+des+' – Qté: '+qte);
    closeModal(); toast('Article enregistré','success'); this.render('stocks');
  }

  // ------ EDIT/DELETE ------
  async editItem(store,id){
    const items=await this.db.getAll(store);
    const item=items.find(i=>i.id===id); if(!item) return;
    if(store==='stocks') { this.formStock(item); return; }
    // Édition générique
    document.getElementById('modalTitle').textContent='Modifier opération';
    document.getElementById('modalBody').innerHTML=`
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Date</label>
          <input type="date" class="form-control" id="eDate" value="${item.date||''}"></div>
        <div class="form-group"><label class="form-label">Montant (FCFA)</label>
          <input type="number" class="form-control" id="eMontant" value="${item.montant||0}"></div>
        <div class="form-group full"><label class="form-label">Libellé</label>
          <input type="text" class="form-control" id="eLibelle" value="${item.libelle||item.client||item.description||''}"></div>
      </div>`;
    document.getElementById('modalFooter').innerHTML=`
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="app.applyEdit('${store}',${id})">Enregistrer</button>`;
    document.getElementById('modalOverlay').classList.add('open');
  }
  async applyEdit(store,id){
    const items=await this.db.getAll(store);
    const item=items.find(i=>i.id===id); if(!item) return;
    const upd={...item,
      date:document.getElementById('eDate').value,
      montant:parseFloat(document.getElementById('eMontant').value)||0,
      libelle:document.getElementById('eLibelle').value};
    if(upd.client) upd.client=upd.libelle;
    if(upd.description) upd.description=upd.libelle;
    await this.db.put(store,upd);
    await this.log('Modification',store+' #'+id);
    closeModal(); toast('Modifié','success'); this.render(store);
  }
  async deleteItem(store,id){
    if(!this.canDelete()){ toast('Non autorisé','error'); return; }
    if(!confirm('Supprimer cette opération ?')) return;
    await this.db.delete(store,id);
    await this.log('Suppression',store+' #'+id);
    toast('Supprimé','success'); this.render(store);
  }

  // ------ EXPORT EXCEL ------
  async exportExcel(){
    const [enc,dec,ventes,achats,stocks,journal]=await Promise.all([
      this.db.getAll('encaissements'),this.db.getAll('decaissements'),
      this.db.getAll('ventes'),this.db.getAll('achats'),this.db.getAll('stocks'),
      this.db.getAll('journal')
    ]);
    // CSV simple
    const toCSV=(arr,cols)=>[cols.join(','),...arr.map(r=>cols.map(c=>JSON.stringify(r[c]||'')).join(','))].join('\n');
    const encCSV=toCSV(enc,['date','libelle','montant','categorie','mode_paiement','user']);
    const link=document.createElement('a');
    link.href='data:text/csv;charset=utf-8,'+encodeURIComponent(encCSV);
    link.download='ERP_Encaissements_'+this.today()+'.csv';
    link.click();
    toast('Export téléchargé','success');
  }

  // ------ ACTIONS ADMIN ------
  async clearJournal(){
    if(!confirm('Vider tout le journal ?')) return;
    await this.db.clear('journal');
    toast('Journal vidé','success');
    if(this.page==='journal') this.render('journal');
    if(this.page==='parametres') this.renderParametres();
  }
  async resetAll(){
    const c=prompt('ATTENTION: supprime TOUTES les données. Tapez CONFIRMER:');
    if(c!=='CONFIRMER') return;
    for(const s of ['encaissements','decaissements','ventes','achats','stocks','journal','sync_queue'])
      await this.db.clear(s);
    await this.log('Reset','Réinitialisation complète');
    toast('Données réinitialisées','success'); this.nav('dashboard');
  }

  // ------ PERMISSIONS ------
  isAdmin(){ return this.user&&this.user.role==='Administrateur'; }
  isGerant(){ return this.user&&(this.user.role==='Gerant'||this.isAdmin()); }
  canEdit(store){
    const r=this.user?this.user.role:'';
    if(r==='Administrateur'||r==='Gerant') return true;
    if(r==='Comptable') return ['encaissements','decaissements','achats'].includes(store);
    if(r==='Vendeur') return ['ventes','stocks'].includes(store);
    return false;
  }
  canDelete(){ return this.isGerant(); }

  logout(){
    this.user=null;
    document.getElementById('appContainer').style.display='none';
    document.getElementById('loginScreen').style.display='flex';
    pinBuf=''; selUser=null; showUserSel();
    renderUsers();
  }
}

// ---- HELPERS GLOBAUX ----
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+type;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2800);
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}
function showUserSel(){ 
  document.getElementById('userSelView').style.display='';
  document.getElementById('pinView').classList.remove('show');
  pinBuf='';
  for(let i=0;i<4;i++) document.getElementById('pd'+i).classList.remove('filled');
}

// ---- INIT ----
const app=new ERPApp();
renderUsers();

// Check mobile
if(window.innerWidth<=768) document.getElementById('menuBtn').style.display='flex';

// Responsive
window.addEventListener('resize',()=>{
  const mb=document.getElementById('menuBtn');
  if(mb) mb.style.display=window.innerWidth<=768?'flex':'none';
});

// Fermer modal sur overlay
document.getElementById('modalOverlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('modalOverlay')) closeModal();
});
</script>
